<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Recipes — USE IT UP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="site-header"></header>

  <main style="padding-top: 5rem; padding-bottom: 5rem;">
    <div class="container">
      <div class="page-hero text-left" style="padding-top: 3rem; padding-bottom: 2rem;">
        <h1 id="recipes-page-title">Recipes</h1>
        <p id="recipes-page-subtitle">Discover what to make next.</p>
      </div>

      <!-- AI Generated Section (if coming from scan) -->
      <section id="ai-section" style="display: none; margin-bottom: 4rem;">
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
          <i data-lucide="sparkles" style="color: var(--amber-dark);"></i>
          <h2 style="font-size: 1.75rem;" id="ai-section-heading">Made for your ingredients</h2>
        </div>
        <div id="ai-loading" style="display: none; text-align: center; padding: 3rem 0;">
          <div style="font-size: 1.25rem; font-weight: 600; color: var(--navy); margin-bottom: 0.5rem;" id="ai-loading-text">
            Creating recipes from your ingredients...
          </div>
          <p style="color: var(--text-muted);">Please wait a moment while we analyze combinations.</p>
        </div>
        <div class="recipe-grid" id="ai-recipes-grid"></div>
      </section>

      <!-- Search & Filters -->
      <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
        <div class="search-wrapper">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="recipe-search-input" class="search-input" placeholder="Search recipes or ingredients...">
        </div>

        <div class="filter-pills" id="category-pills"></div>
      </div>

      <!-- Recipe Grid -->
      <div class="recipe-grid" id="recipes-grid"></div>

      <!-- Empty state -->
      <div id="empty-state" style="display: none; text-align: center; padding: 4rem 1rem;">
        <p style="color: var(--text-muted); font-size: 1.125rem; margin-bottom: 1.5rem;" id="empty-state-text">
          No recipes match your search.
        </p>
        <a href="scan.html" class="btn btn-primary">Scan your ingredients</a>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Store = window.USEITUP_STORE;
      const AI = window.USEITUP_AI;

      document.getElementById("recipes-page-title").textContent = Store.t("recipes_title");
      document.getElementById("recipes-page-subtitle").textContent = Store.t("recipes_subtitle");
      document.getElementById("recipe-search-input").placeholder = Store.t("search_recipes_placeholder");
      document.getElementById("empty-state-text").textContent = Store.t("no_recipes_found");

      let activeCategory = null;
      let searchQuery = "";

      // Setup category pills
      const pillsContainer = document.getElementById("category-pills");
      const categories = [Store.t("category_all"), ...window.USEITUP_DATA.categories];
      pillsContainer.innerHTML = categories.map((cat, idx) => `
        <button class="pill ${idx === 0 ? 'active' : ''}" data-cat="${idx === 0 ? '' : cat}">
          ${cat}
        </button>
      `).join("");

      pillsContainer.querySelectorAll(".pill").forEach(p => {
        p.addEventListener("click", () => {
          pillsContainer.querySelectorAll(".pill").forEach(x => x.classList.remove("active"));
          p.classList.add("active");
          activeCategory = p.getAttribute("data-cat") || null;
          renderRecipes();
        });
      });

      // Search input handler
      const searchInput = document.getElementById("recipe-search-input");
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        renderRecipes();
      });

      function renderRecipes() {
        const grid = document.getElementById("recipes-grid");
        const emptyState = document.getElementById("empty-state");
        const all = Store.getAllRecipes();

        const filtered = all.filter(r => {
          const matchesCat = !activeCategory || (r.category && r.category.includes(activeCategory));
          const matchesSearch = !searchQuery ||
            r.title.toLowerCase().includes(searchQuery) ||
            r.ingredients.some(i => i.toLowerCase().includes(searchQuery));
          return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
          grid.innerHTML = "";
          emptyState.style.display = "block";
          return;
        }

        emptyState.style.display = "none";
        grid.innerHTML = filtered.map(r => `
          <div class="recipe-card">
            <div class="recipe-card-media">
              <a href="recipe-detail.html?id=${r.id}">
                <img src="${r.image}" alt="${r.title}" loading="eager" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=900&q=80&auto=format&fit=crop';">
                <div class="overlay"></div>
              </a>
              <button class="recipe-like-btn ${Store.isRecipeLiked(r.id) ? 'liked' : ''}" data-id="${r.id}" aria-label="Like recipe">
                <i data-lucide="heart" style="width: 1rem; height: 1rem; ${Store.isRecipeLiked(r.id) ? 'fill: currentColor;' : ''}"></i>
              </button>
              <div class="recipe-badge">${r.category[0] || 'Recipe'}</div>
            </div>
            <div class="recipe-card-body">
              <a href="recipe-detail.html?id=${r.id}">
                <h3>${r.title}</h3>
              </a>
              <div class="recipe-meta">
                <span><i data-lucide="clock" style="width: 0.875rem;"></i> ${r.time}</span>
                <span><i data-lucide="flame" style="width: 0.875rem;"></i> ${r.difficulty}</span>
                <span><i data-lucide="heart" style="width: 0.875rem;"></i> <strong class="likes-count">${r.likes}</strong></span>
              </div>
            </div>
          </div>
        `).join("");

        attachCardHandlers(grid);
        if (window.lucide) window.lucide.createIcons();
      }

      function attachCardHandlers(container) {
        container.querySelectorAll(".recipe-like-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            const id = btn.getAttribute("data-id");
            const liked = Store.toggleLikeRecipe(id);
            btn.classList.toggle("liked", liked);
            const icon = btn.querySelector("i");
            if (icon) icon.style.fill = liked ? "currentColor" : "none";
            const countEl = btn.closest(".recipe-card").querySelector(".likes-count");
            if (countEl) {
              const recipe = Store.getRecipeById(id);
              countEl.textContent = recipe.likes;
            }
          });
        });
      }

      // Check if URL has ingredients to generate (e.g., ?ingredients=Tomato,Pasta)
      const urlParams = new URLSearchParams(window.location.search);
      const ingredientsParam = urlParams.get("ingredients");
      if (ingredientsParam) {
        const ingList = ingredientsParam.split(",").map(i => i.trim()).filter(Boolean);
        if (ingList.length > 0) {
          const aiSection = document.getElementById("ai-section");
          const aiLoading = document.getElementById("ai-loading");
          const aiGrid = document.getElementById("ai-recipes-grid");
          aiSection.style.display = "block";
          aiLoading.style.display = "block";
          document.getElementById("ai-section-heading").textContent = Store.t("creating_recipes");

          AI.generateRecipes(ingList).then(recipes => {
            aiLoading.style.display = "none";
            document.getElementById("ai-section-heading").textContent = Store.t("made_for_ingredients");
            recipes.forEach(r => Store.addRecipe(r));
            aiGrid.innerHTML = recipes.map(r => `
              <div class="recipe-card">
                <div class="recipe-card-media">
                  <a href="recipe-detail.html?id=${r.id}">
                    <img src="${r.image}" alt="${r.title}" loading="eager" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=900&q=80&auto=format&fit=crop';">
                    <div class="overlay"></div>
                  </a>
                  <button class="recipe-like-btn ${Store.isRecipeLiked(r.id) ? 'liked' : ''}" data-id="${r.id}">
                    <i data-lucide="heart" style="width: 1rem; height: 1rem; ${Store.isRecipeLiked(r.id) ? 'fill: currentColor;' : ''}"></i>
                  </button>
                  <div class="recipe-badge" style="background: var(--amber); color: #fff;">AI Suggested</div>
                </div>
                <div class="recipe-card-body">
                  <a href="recipe-detail.html?id=${r.id}">
                    <h3>${r.title}</h3>
                  </a>
                  <div class="recipe-meta">
                    <span><i data-lucide="clock" style="width: 0.875rem;"></i> ${r.time}</span>
                    <span><i data-lucide="flame" style="width: 0.875rem;"></i> ${r.difficulty}</span>
                    <span><i data-lucide="heart" style="width: 0.875rem;"></i> <strong class="likes-count">${r.likes || 0}</strong></span>
                  </div>
                </div>
              </div>
            `).join("");
            attachCardHandlers(aiGrid);
            if (window.lucide) window.lucide.createIcons();
          });
        }
      }

      renderRecipes();
    });
  </script>
</body>
</html>
