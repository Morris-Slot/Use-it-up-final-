<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Scan Ingredients — USE IT UP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .scan-box {
      background: var(--bg-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      padding: 2.5rem;
      box-shadow: var(--card-shadow);
      margin-bottom: 2rem;
    }
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--card-shadow-hover);
      z-index: 50;
      max-height: 200px;
      overflow-y: auto;
      list-style: none;
      margin-top: 0.25rem;
      display: none;
    }
    .autocomplete-item {
      padding: 0.65rem 1rem;
      cursor: pointer;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition-fast);
    }
    .autocomplete-item:hover {
      background: var(--bg-surface-secondary);
    }
  </style>
</head>
<body>
  <header class="site-header"></header>

  <main style="padding-top: 5rem; padding-bottom: 6rem;">
    <div class="container container-narrow">
      <div class="page-hero text-center" style="padding-top: 3rem; padding-bottom: 2.5rem;">
        <p class="hero-tagline" id="scan-step-tag">Step 1 of 2</p>
        <h1 id="scan-page-title">What's left in your kitchen?</h1>
        <p id="scan-page-subtitle">Scan, upload, or type it in — however you like.</p>
      </div>

      <!-- Hidden file input -->
      <input type="file" id="scan-file-input" accept="image/*" style="display: none;">
      <input type="file" id="camera-file-input" accept="image/*" capture="environment" style="display: none;">

      <!-- MODE 1: CHOOSE INPUT -->
      <div id="mode-choose" class="cards-grid-3">
        <button id="btn-choose-camera" class="entry-card" style="width: 100%; cursor: pointer;">
          <div class="icon-wrapper"><i data-lucide="camera" style="width: 2rem; height: 2rem;"></i></div>
          <h3 id="btn-camera-title">SCAN PHOTO</h3>
          <p id="btn-camera-desc">Take a photo of your ingredients.</p>
        </button>
        <button id="btn-choose-upload" class="entry-card" style="width: 100%; cursor: pointer;">
          <div class="icon-wrapper"><i data-lucide="upload" style="width: 2rem; height: 2rem;"></i></div>
          <h3 id="btn-upload-title">UPLOAD PHOTO</h3>
          <p id="btn-upload-desc">Upload an existing photo.</p>
        </button>
        <button id="btn-choose-manual" class="entry-card" style="width: 100%; cursor: pointer;">
          <div class="icon-wrapper"><i data-lucide="keyboard" style="width: 2rem; height: 2rem;"></i></div>
          <h3 id="btn-manual-title">ENTER MANUALLY</h3>
          <p id="btn-manual-desc">Add your ingredients by hand.</p>
        </button>
      </div>

      <!-- MODE 2: ANALYZING ANIMATION -->
      <div id="mode-analyzing" class="scan-box text-center" style="display: none; padding: 4rem 2rem;">
        <div style="width: 4rem; height: 4rem; margin: 0 auto 1.5rem; border-radius: var(--radius-full); background: rgba(244, 162, 97, 0.2); display: flex; align-items: center; justify-content: center;">
          <i data-lucide="sparkles" style="color: var(--amber-dark); width: 2rem; height: 2rem; animation: spin 2s linear infinite;"></i>
        </div>
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;" id="analyzing-heading">Analyzing your ingredients...</h2>
        <p style="color: var(--text-muted);" id="analyzing-sub">USE IT UP AI is taking a look</p>
      </div>

      <!-- MODE 3: REVIEW & INGREDIENT LIST -->
      <div id="mode-review" class="scan-box" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2 style="font-size: 1.35rem;" id="review-title">Your ingredients:</h2>
          <button id="reset-scan-btn" class="btn btn-outline" style="padding: 0.35rem 0.85rem; font-size: 0.8125rem;">
            Start over
          </button>
        </div>

        <div id="image-preview-container" style="display: none; margin-bottom: 1.5rem; border-radius: var(--radius-md); overflow: hidden; max-height: 220px;">
          <img id="image-preview" src="" alt="Ingredients Preview" style="width: 100%; height: 220px; object-fit: cover;">
        </div>

        <!-- Chips -->
        <div class="chips-container" id="chips-container"></div>
        <div id="empty-ingredients-msg" style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; display: none;">
          Nothing added yet.
        </div>

        <!-- Add Input with autocomplete -->
        <div style="position: relative; margin-top: 1.5rem; margin-bottom: 2.5rem;">
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="add-ingredient-input" class="form-input" placeholder="Search for an ingredient, e.g. Tomato..." autocomplete="off">
            <button id="add-ingredient-btn" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
              Add
            </button>
          </div>
          <ul class="autocomplete-list" id="autocomplete-list"></ul>
        </div>

        <button id="generate-recipes-btn" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.05rem;">
          <i data-lucide="sparkles"></i> <span id="generate-btn-text">GENERATE RECIPES</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Store = window.USEITUP_STORE;
      const AI = window.USEITUP_AI;
      const lang = Store.getLanguage();

      // Translations
      document.getElementById("scan-step-tag").textContent = Store.t("scan_step");
      document.getElementById("scan-page-title").textContent = Store.t("scan_title");
      document.getElementById("scan-page-subtitle").textContent = Store.t("scan_subtitle");
      document.getElementById("btn-camera-title").textContent = Store.t("scan_photo_btn");
      document.getElementById("btn-camera-desc").textContent = Store.t("scan_photo_desc");
      document.getElementById("btn-upload-title").textContent = Store.t("upload_photo_btn");
      document.getElementById("btn-upload-desc").textContent = Store.t("upload_photo_desc");
      document.getElementById("btn-manual-title").textContent = Store.t("enter_manually_btn");
      document.getElementById("btn-manual-desc").textContent = Store.t("enter_manually_desc");
      document.getElementById("analyzing-heading").textContent = Store.t("analyzing_title");
      document.getElementById("analyzing-sub").textContent = Store.t("ai_looking");
      document.getElementById("review-title").textContent = Store.t("your_ingredients");
      document.getElementById("empty-ingredients-msg").textContent = Store.t("nothing_added");
      document.getElementById("add-ingredient-input").placeholder = Store.t("search_ingredient_placeholder");
      document.getElementById("add-ingredient-btn").textContent = Store.t("add_btn");
      document.getElementById("generate-btn-text").textContent = Store.t("generate_recipes");

      let currentIngredients = [];
      const modeChoose = document.getElementById("mode-choose");
      const modeAnalyzing = document.getElementById("mode-analyzing");
      const modeReview = document.getElementById("mode-review");
      const chipsContainer = document.getElementById("chips-container");
      const emptyMsg = document.getElementById("empty-ingredients-msg");
      const imgPreviewContainer = document.getElementById("image-preview-container");
      const imgPreview = document.getElementById("image-preview");

      const fileInput = document.getElementById("scan-file-input");
      const cameraInput = document.getElementById("camera-file-input");

      function setMode(mode) {
        modeChoose.style.display = mode === "choose" ? "grid" : "none";
        modeAnalyzing.style.display = mode === "analyzing" ? "block" : "none";
        modeReview.style.display = mode === "review" ? "block" : "none";
        if (window.lucide) window.lucide.createIcons();
      }

      function renderChips() {
        if (currentIngredients.length === 0) {
          chipsContainer.innerHTML = "";
          emptyMsg.style.display = "block";
          return;
        }
        emptyMsg.style.display = "none";
        chipsContainer.innerHTML = currentIngredients.map(ing => `
          <div class="ingredient-chip">
            <span>${ing}</span>
            <span class="chip-remove" data-name="${ing}">&times;</span>
          </div>
        `).join("");

        chipsContainer.querySelectorAll(".chip-remove").forEach(btn => {
          btn.addEventListener("click", () => {
            const name = btn.getAttribute("data-name");
            currentIngredients = currentIngredients.filter(i => i !== name);
            renderChips();
          });
        });
      }

      async function processFile(file) {
        if (!file) return;
        imgPreview.src = URL.createObjectURL(file);
        imgPreviewContainer.style.display = "block";
        setMode("analyzing");

        try {
          const detected = await AI.analyzeFoodImage(file);
          currentIngredients = detected.map(d => d.name);
          renderChips();
          setMode("review");
        } catch (err) {
          window.USEITUP_COMMON.showToast("Analysis fallback applied");
          currentIngredients = ["Tomato", "Pasta", "Garlic"];
          renderChips();
          setMode("review");
        }
      }

      fileInput.addEventListener("change", (e) => processFile(e.target.files[0]));
      cameraInput.addEventListener("change", (e) => processFile(e.target.files[0]));

      document.getElementById("btn-choose-upload").onclick = () => fileInput.click();
      document.getElementById("btn-choose-camera").onclick = () => cameraInput.click();
      document.getElementById("btn-choose-manual").onclick = () => {
        imgPreviewContainer.style.display = "none";
        renderChips();
        setMode("review");
      };

      document.getElementById("reset-scan-btn").onclick = () => {
        currentIngredients = [];
        fileInput.value = "";
        cameraInput.value = "";
        setMode("choose");
      };

      // Autocomplete & Add Manual
      const addInput = document.getElementById("add-ingredient-input");
      const addBtn = document.getElementById("add-ingredient-btn");
      const autoList = document.getElementById("autocomplete-list");

      function addIngredient(val) {
        const trimmed = (val || addInput.value).trim();
        if (!trimmed) return;
        const canonical = trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
        if (!currentIngredients.some(i => i.toLowerCase() === canonical.toLowerCase())) {
          currentIngredients.push(canonical);
          renderChips();
        }
        addInput.value = "";
        autoList.style.display = "none";
      }

      addBtn.onclick = () => addIngredient();
      addInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          addIngredient();
        }
      });

      addInput.addEventListener("input", (e) => {
        const q = e.target.value.trim().toLowerCase();
        if (!q) {
          autoList.style.display = "none";
          return;
        }

        const matches = window.USEITUP_DATA.ingredients.filter(i =>
          (i[lang] && i[lang].toLowerCase().includes(q)) ||
          i.en.toLowerCase().includes(q)
        ).slice(0, 6);

        if (matches.length === 0) {
          autoList.style.display = "none";
          return;
        }

        autoList.innerHTML = matches.map(m => `
          <li class="autocomplete-item" data-val="${m.en}">
            <strong>${m[lang] || m.en}</strong>
            ${m[lang] && m[lang] !== m.en ? `<span style="color: var(--text-muted); font-size: 0.75rem;"> (${m.en})</span>` : ''}
          </li>
        `).join("");
        autoList.style.display = "block";

        autoList.querySelectorAll(".autocomplete-item").forEach(item => {
          item.onclick = () => {
            addIngredient(item.getAttribute("data-val"));
          };
        });
      });

      document.addEventListener("click", (e) => {
        if (!autoList.contains(e.target) && e.target !== addInput) {
          autoList.style.display = "none";
        }
      });

      // Generate Recipes
      document.getElementById("generate-recipes-btn").onclick = () => {
        if (currentIngredients.length === 0) {
          window.USEITUP_COMMON.showToast("Please add at least one ingredient first!");
          return;
        }
        Store.recordMealSaved();
        const param = encodeURIComponent(currentIngredients.join(","));
        window.location.href = `recipes.html?ingredients=${param}`;
      };

      // Check mode in URL (e.g. ?mode=manual or ?mode=camera)
      const urlParams = new URLSearchParams(window.location.search);
      const initialMode = urlParams.get("mode");
      if (initialMode === "manual") {
        setMode("review");
      } else if (initialMode === "upload") {
        fileInput.click();
      } else if (initialMode === "camera") {
        cameraInput.click();
      } else {
        setMode("choose");
      }
    });
  </script>
</body>
</html>
