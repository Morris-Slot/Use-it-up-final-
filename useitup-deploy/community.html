<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Community — USE IT UP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="site-header"></header>

  <main style="padding-top: 5rem; padding-bottom: 6rem;">
    <div class="container">
      <div class="page-hero text-center" style="padding-top: 3rem; padding-bottom: 2rem;">
        <h1 id="community-title">Made something good? Share it.</h1>
        <p id="community-subtitle">Real meals, made from real leftovers, by real cooks.</p>
        <div style="margin-top: 2rem;" id="post-cta-container">
          <button id="open-new-post-modal-btn" class="btn btn-primary">
            <i data-lucide="plus"></i> <span id="new-post-btn-text">New post</span>
          </button>
        </div>
      </div>

      <!-- Feed Grid -->
      <div class="post-grid" id="community-posts-grid"></div>
    </div>

    <!-- NEW POST MODAL -->
    <div id="new-post-modal" class="modal-overlay">
      <div class="modal-card">
        <button class="modal-close" id="close-post-modal"><i data-lucide="x"></i></button>
        <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;" id="modal-post-title">New post</h2>

        <form id="new-post-form">
          <div class="form-group">
            <label class="form-label" id="photo-label">Photo</label>
            <div id="drop-area" style="border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 2rem; text-align: center; cursor: pointer;">
              <i data-lucide="camera" style="width: 2rem; height: 2rem; margin: 0 auto 0.5rem; color: var(--navy);"></i>
              <p style="font-size: 0.875rem; color: var(--text-muted);" id="upload-photo-text">Click to upload a photo</p>
              <input type="file" id="post-file-input" accept="image/*" style="display: none;">
            </div>
            <div id="preview-box" style="display: none; margin-top: 1rem; border-radius: var(--radius-md); overflow: hidden; max-height: 200px;">
              <img id="post-img-preview" src="" alt="Preview" style="width: 100%; height: 200px; object-fit: cover;">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" id="caption-label">Caption</label>
            <textarea id="post-caption-input" class="form-textarea" placeholder="What did you make?" required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" id="ingredients-used-label">Ingredients used</label>
            <input type="text" id="post-ingredients-input" class="form-input" placeholder="e.g. Pasta, Cheese, Tomato (comma-separated)">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.875rem; margin-top: 1rem;" id="share-post-btn">
            Share post
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Store = window.USEITUP_STORE;
      const currentUser = Store.getCurrentUser();

      // Translations
      document.getElementById("community-title").textContent = Store.t("community_title");
      document.getElementById("community-subtitle").textContent = Store.t("community_subtitle");
      document.getElementById("new-post-btn-text").textContent = Store.t("new_post");
      document.getElementById("modal-post-title").textContent = Store.t("new_post_title");
      document.getElementById("upload-photo-text").textContent = Store.t("upload_photo_click");
      document.getElementById("caption-label").textContent = Store.t("caption_label");
      document.getElementById("post-caption-input").placeholder = Store.t("caption_placeholder");
      document.getElementById("ingredients-used-label").textContent = Store.t("ingredients_used");
      document.getElementById("share-post-btn").textContent = Store.t("share_post");

      const ctaContainer = document.getElementById("post-cta-container");
      if (!currentUser) {
        ctaContainer.innerHTML = `<p style="font-size: 0.9375rem; color: var(--text-muted);">${Store.t("log_in_to_share")} <a href="login.html" class="btn btn-outline" style="padding: 0.35rem 0.85rem; margin-left: 0.5rem;">${Store.t("nav_login")}</a></p>`;
      }

      function renderFeed() {
        const grid = document.getElementById("community-posts-grid");
        const posts = Store.getPosts();

        grid.innerHTML = posts.map(p => {
          const isMe = currentUser === p.user;
          const isFollowing = Store.isFollowing(p.user);
          const comments = Store.getPostComments(p.id);
          const isLiked = Store.isPostLiked(p.id);

          return `
            <div class="post-card" id="post-${p.id}">
              <div class="post-header">
                <a href="user.html?username=${p.user}" style="display: flex; align-items: center; gap: 0.75rem;">
                  <img src="${p.avatar}" alt="${p.user}">
                  <span class="user-name">${p.user}</span>
                </a>
                ${currentUser && !isMe ? `
                  <button class="follow-btn" data-username="${p.user}">
                    ${isFollowing ? Store.t("following_btn") : Store.t("follow_btn")}
                  </button>
                ` : ''}
              </div>
              <div class="post-media">
                <img src="${p.image}" alt="${p.caption}" loading="eager" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=900&q=80&auto=format&fit=crop';">
              </div>
              <div class="post-body">
                <div class="post-actions">
                  <button class="post-action-btn like-btn ${isLiked ? 'liked' : ''}" data-id="${p.id}">
                    <i data-lucide="heart" style="width: 1.1rem; height: 1.1rem; ${isLiked ? 'fill: currentColor;' : ''}"></i>
                    <span>${Store.getPostLikesCount(p.id)}</span>
                  </button>
                  <button class="post-action-btn toggle-comments-btn" data-id="${p.id}">
                    <i data-lucide="message-circle" style="width: 1.1rem; height: 1.1rem;"></i>
                    <span>${comments.length}</span>
                  </button>
                </div>
                <p class="post-caption">${p.caption}</p>
                <div class="post-tags">
                  ${p.ingredients.map(ing => `<span class="post-tag">${ing}</span>`).join("")}
                </div>

                <!-- Comments section -->
                <div class="comments-panel" id="comments-${p.id}">
                  <div class="comment-list">
                    ${comments.length === 0 ? `<div style="font-size: 0.8125rem; color: var(--text-muted);">${Store.t("no_comments")}</div>` : ''}
                    ${comments.map(c => `
                      <div class="comment-item">
                        <strong>${c.username}</strong> ${c.text}
                      </div>
                    `).join("")}
                  </div>
                  <div class="comment-form">
                    <input type="text" class="comment-input" placeholder="${currentUser ? Store.t("add_comment_placeholder") : Store.t("login_to_comment")}" ${!currentUser ? 'disabled' : ''}>
                    <button class="btn btn-primary send-comment-btn" style="padding: 0.4rem 0.85rem; font-size: 0.8125rem;" ${!currentUser ? 'disabled' : ''}>
                      <i data-lucide="send" style="width: 0.875rem;"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join("");

        // Attach listeners
        attachFeedListeners(grid);
        if (window.lucide) window.lucide.createIcons();
      }

      function attachFeedListeners(container) {
        // Likes
        container.querySelectorAll(".like-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            const liked = Store.toggleLikePost(id);
            btn.classList.toggle("liked", liked);
            btn.querySelector("span").textContent = Store.getPostLikesCount(id);
            const icon = btn.querySelector("i");
            if (icon) icon.style.fill = liked ? "currentColor" : "none";
          });
        });

        // Toggle comments
        container.querySelectorAll(".toggle-comments-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            const panel = document.getElementById(`comments-${id}`);
            if (panel) panel.classList.toggle("open");
          });
        });

        // Add comments
        container.querySelectorAll(".post-card").forEach(card => {
          const id = card.id.replace("post-", "");
          const input = card.querySelector(".comment-input");
          const sendBtn = card.querySelector(".send-comment-btn");

          const submitComment = () => {
            if (!input || !input.value.trim() || !currentUser) return;
            Store.addComment(id, input.value.trim());
            input.value = "";
            renderFeed();
            // Re-open comments for that post
            const updatedPanel = document.getElementById(`comments-${id}`);
            if (updatedPanel) updatedPanel.classList.add("open");
          };

          if (sendBtn) sendBtn.onclick = submitComment;
          if (input) {
            input.addEventListener("keydown", (e) => {
              if (e.key === "Enter") submitComment();
            });
          }
        });

        // Follow buttons
        container.querySelectorAll(".follow-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const username = btn.getAttribute("data-username");
            Store.toggleFollow(username);
            renderFeed();
          });
        });
      }

      // Modal handling
      const modal = document.getElementById("new-post-modal");
      const openBtn = document.getElementById("open-new-post-modal-btn");
      const closeBtn = document.getElementById("close-post-modal");
      const dropArea = document.getElementById("drop-area");
      const fileInput = document.getElementById("post-file-input");
      const previewBox = document.getElementById("preview-box");
      const previewImg = document.getElementById("post-img-preview");

      let uploadedImage = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=900&q=80&auto=format&fit=crop";

      if (openBtn) {
        openBtn.onclick = () => {
          if (!currentUser) {
            window.location.href = "login.html";
            return;
          }
          modal.classList.add("open");
        };
      }

      closeBtn.onclick = () => modal.classList.remove("open");
      dropArea.onclick = () => fileInput.click();

      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          uploadedImage = URL.createObjectURL(file);
          previewImg.src = uploadedImage;
          previewBox.style.display = "block";
        }
      };

      document.getElementById("new-post-form").onsubmit = (e) => {
        e.preventDefault();
        const caption = document.getElementById("post-caption-input").value.trim();
        const ingredientsRaw = document.getElementById("post-ingredients-input").value;
        const ingredients = ingredientsRaw.split(",").map(i => i.trim()).filter(Boolean);

        Store.addPost(uploadedImage, caption, ingredients.length > 0 ? ingredients : ["Leftovers"]);
        modal.classList.remove("open");
        document.getElementById("new-post-form").reset();
        previewBox.style.display = "none";
        renderFeed();
        window.USEITUP_COMMON.showToast("Dish shared to community!");
      };

      renderFeed();
    });
  </script>
</body>
</html>
