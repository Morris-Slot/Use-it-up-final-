<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Sign Up — USE IT UP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <header class="site-header"></header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 7rem 1.5rem 4rem; overflow: hidden; background: var(--bg-hero);">
    <div class="floating-container auth-floating"></div>

    <div style="width: 100%; max-width: 26rem; background: var(--bg-surface); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--card-shadow-hover); border: 1px solid var(--border); position: relative; z-index: 2;">
      <a href="index.html" class="brand-logo text-center" style="display: block; margin-bottom: 0.5rem;">USE IT UP</a>
      <h1 style="font-size: 1.5rem; text-align: center; margin-bottom: 2rem;" id="signup-title">Create your account</h1>

      <div id="signup-error" style="display: none; background: rgba(220, 53, 69, 0.1); color: #dc3545; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" id="username-label">Username</label>
          <input type="text" id="signup-username" class="form-input" placeholder="chef_anna" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="email-label">Email</label>
          <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="password-label">Password</label>
          <input type="password" id="signup-password" class="form-input" placeholder="At least 6 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="confirm-label">Confirm password</label>
          <input type="password" id="signup-confirm" class="form-input" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.875rem; font-size: 0.9375rem; margin-top: 0.5rem;" id="submit-signup-btn">
          CREATE ACCOUNT
        </button>
      </form>

      <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted); margin-top: 1.5rem;">
        <span id="have-account-text">Already have an account?</span> <a href="login.html" style="color: var(--navy); font-weight: 700; text-decoration: underline;">Log in</a>
      </p>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Store = window.USEITUP_STORE;
      window.USEITUP_COMMON.renderFloatingIngredients(".auth-floating");

      if (Store.getCurrentUser()) {
        window.location.href = "profile.html";
        return;
      }

      // Translations
      document.getElementById("signup-title").textContent = Store.t("create_account_title");
      document.getElementById("username-label").textContent = Store.t("username_label");
      document.getElementById("email-label").textContent = Store.t("email_label");
      document.getElementById("password-label").textContent = Store.t("password_label");
      document.getElementById("confirm-label").textContent = Store.t("confirm_password_label");
      document.getElementById("submit-signup-btn").textContent = Store.t("create_account_btn");
      document.getElementById("have-account-text").textContent = Store.t("already_have_account");

      const form = document.getElementById("signup-form");
      const errBox = document.getElementById("signup-error");

      form.onsubmit = (e) => {
        e.preventDefault();
        const username = document.getElementById("signup-username").value;
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;
        const confirm = document.getElementById("signup-confirm").value;

        const res = Store.signup(username, email, password, confirm);
        if (!res.ok) {
          errBox.textContent = res.error || "Signup error";
          errBox.style.display = "block";
        } else {
          window.location.href = "profile.html";
        }
      };
    });
  </script>
</body>
</html>
