<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Log In — USE IT UP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <header class="site-header"></header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 7rem 1.5rem 4rem; overflow: hidden; background: var(--bg-hero);">
    <div class="floating-container auth-floating"></div>

    <div style="width: 100%; max-width: 26rem; background: var(--bg-surface); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--card-shadow-hover); border: 1px solid var(--border); position: relative; z-index: 2;">
      <a href="index.html" class="brand-logo text-center" style="display: block; margin-bottom: 0.5rem;">USE IT UP</a>
      <h1 style="font-size: 1.5rem; text-align: center; margin-bottom: 2rem;" id="login-title">Welcome back</h1>

      <div id="login-error" style="display: none; background: rgba(220, 53, 69, 0.1); color: #dc3545; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" id="email-label">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="password-label">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.875rem; font-size: 0.9375rem; margin-top: 0.5rem;" id="submit-login-btn">
          LOG IN
        </button>
      </form>

      <!-- Quick demo login buttons -->
      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center;">
        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.75rem;">Quick Demo Login</span>
        <div style="display: flex; gap: 0.5rem; justify-content: center;">
          <button class="btn btn-outline demo-btn" data-email="elena@example.com" style="padding: 0.35rem 0.65rem; font-size: 0.75rem;">Elena</button>
          <button class="btn btn-outline demo-btn" data-email="marcus@example.com" style="padding: 0.35rem 0.65rem; font-size: 0.75rem;">Marcus</button>
          <button class="btn btn-outline demo-btn" data-email="priya@example.com" style="padding: 0.35rem 0.65rem; font-size: 0.75rem;">Priya</button>
        </div>
      </div>

      <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted); margin-top: 1.5rem;">
        <span id="no-account-text">Don't have an account?</span> <a href="signup.html" style="color: var(--navy); font-weight: 700; text-decoration: underline;" id="sign-up-link">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Store = window.USEITUP_STORE;
      window.USEITUP_COMMON.renderFloatingIngredients(".auth-floating");

      if (Store.getCurrentUser()) {
        window.location.href = "profile.html";
        return;
      }

      // Translations
      document.getElementById("login-title").textContent = Store.t("welcome_back");
      document.getElementById("email-label").textContent = Store.t("email_label");
      document.getElementById("password-label").textContent = Store.t("password_label");
      document.getElementById("submit-login-btn").textContent = Store.t("log_in_btn");
      document.getElementById("no-account-text").textContent = Store.t("no_account_yet");
      document.getElementById("sign-up-link").textContent = Store.t("sign_up_link");

      const form = document.getElementById("login-form");
      const errBox = document.getElementById("login-error");

      form.onsubmit = (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        const pass = document.getElementById("login-password").value;

        const res = Store.login(email, pass);
        if (!res.ok) {
          errBox.textContent = res.error || "Incorrect login";
          errBox.style.display = "block";
        } else {
          window.location.href = "profile.html";
        }
      };

      document.querySelectorAll(".demo-btn").forEach(btn => {
        btn.onclick = () => {
          document.getElementById("login-email").value = btn.getAttribute("data-email");
          document.getElementById("login-password").value = "password123";
          form.dispatchEvent(new Event("submit"));
        };
      });
    });
  </script>
</body>
</html>
