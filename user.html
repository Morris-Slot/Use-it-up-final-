<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Cook Profile — USE IT UP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .user-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 3.5rem;
      text-align: center;
    }
    @media (min-width: 640px) {
      .user-hero {
        flex-direction: row;
        text-align: left;
        align-items: flex-end;
      }
    }
    .user-avatar-img {
      width: 7rem;
      height: 7rem;
      border-radius: var(--radius-full);
      object-fit: cover;
      border: 3px solid var(--border);
      background: var(--bg-surface);
    }
  </style>
</head>
<body>
  <header class="site-header"></header>

  <main style="padding-top: 5rem; padding-bottom: 6rem;">
    <div class="container container-narrow">
      <div id="user-not-found" style="display: none; text-align: center; padding: 6rem 1rem;">
        <h2 style="margin-bottom: 1rem;">This user doesn't exist.</h2>
        <a href="community.html" class="btn btn-primary">Back to Community</a>
      </div>

      <div id="user-profile-content" style="display: none;">
        <div class="page-hero text-left" style="padding-top: 2rem; padding-bottom: 1rem;">
          <div class="user-hero">
            <img id="public-user-avatar" class="user-avatar-img" src="" alt="Avatar">
            <div style="flex: 1;">
              <h1 id="public-user-name" style="font-size: 2.25rem; margin-bottom: 0.25rem;"></h1>
              <p id="public-user-bio" style="color: var(--text-muted); font-size: 1rem; margin-bottom: 0.75rem;"></p>
              <div style="display: flex; gap: 1.5rem; font-size: 0.875rem;">
                <span><strong id="public-followers-count">0</strong> <span id="public-followers-label">followers</span></span>
                <span><strong id="public-following-count">0</strong> <span id="public-following-label">following</span></span>
              </div>
            </div>
            <div id="follow-action-box">
              <button id="toggle-follow-btn" class="btn btn-primary" style="font-size: 0.875rem; padding: 0.5rem 1.5rem;">
                Follow
              </button>
            </div>
          </div>
        </div>

        <div style="margin-top: 2rem;">
          <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;" id="cook-posts-title">Posts</h2>
          <div class="post-grid" id="cook-posts-grid"></div>
          <div id="no-cook-posts-msg" style="display: none; text-align: center; padding: 3rem 0; color: var(--text-muted);">
            No posts yet.
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Store = window.USEITUP_STORE;
      const urlParams = new URLSearchParams(window.location.search);
      const targetUsername = urlParams.get("username");
      const currentUser = Store.getCurrentUser();

      if (currentUser && currentUser === targetUsername) {
        window.location.href = "profile.html";
        return;
      }

      const notFoundEl = document.getElementById("user-not-found");
      const contentEl = document.getElementById("user-profile-content");

      const user = targetUsername ? Store.getUser(targetUsername) : null;
      if (!user) {
        notFoundEl.style.display = "block";
        return;
      }

      contentEl.style.display = "block";

      // Translations
      document.getElementById("public-followers-label").textContent = Store.t("followers_label");
      document.getElementById("public-following-label").textContent = Store.t("following_label");
      document.getElementById("cook-posts-title").textContent = Store.t("posts_title");

      // Details
      document.getElementById("public-user-avatar").src = user.avatar;
      document.getElementById("public-user-name").textContent = user.username;
      document.getElementById("public-user-bio").textContent = user.bio;
      document.getElementById("public-followers-count").textContent = user.followers.length;
      document.getElementById("public-following-count").textContent = user.following.length;

      // Follow button
      const followBox = document.getElementById("follow-action-box");
      const followBtn = document.getElementById("toggle-follow-btn");

      if (!currentUser) {
        followBtn.onclick = () => window.location.href = "login.html";
      } else {
        const updateFollowBtn = () => {
          const isFollowing = Store.isFollowing(user.username);
          followBtn.textContent = isFollowing ? Store.t("following_btn") : Store.t("follow_btn");
          followBtn.className = isFollowing ? "btn btn-outline" : "btn btn-primary";
        };

        followBtn.onclick = () => {
          Store.toggleFollow(user.username);
          const updatedUser = Store.getUser(user.username);
          document.getElementById("public-followers-count").textContent = updatedUser.followers.length;
          updateFollowBtn();
        };

        updateFollowBtn();
      }

      // Render posts
      const postsGrid = document.getElementById("cook-posts-grid");
      const noPostsMsg = document.getElementById("no-cook-posts-msg");
      const cookPosts = Store.getPosts().filter(p => p.user === user.username);

      if (cookPosts.length === 0) {
        noPostsMsg.style.display = "block";
      } else {
        postsGrid.innerHTML = cookPosts.map(p => `
          <div class="post-card">
            <div class="post-media"><img src="${p.image}" alt="${p.caption}"></div>
            <div class="post-body">
              <p class="post-caption">${p.caption}</p>
              <div class="post-tags">${p.ingredients.map(i => `<span class="post-tag">${i}</span>`).join("")}</div>
            </div>
          </div>
        `).join("");
      }

      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
